# 打字效果副标题：默认从「一言」API 随机取一句（https://hitokoto.cn）
# source: hitokoto 走一言接口；source: static 则只循环下面的 sub 列表
subtitle:
  enable: true
  source: hitokoto
  api: https://v1.hitokoto.cn/?encode=text&charset=utf-8
  # 一言分类：d 文学 / i 诗词 / k 哲学 / l 抖机灵 / a 动画 / b 漫画 / c 游戏 / e 原创 / f 网络 / g 其他 / h 影视 / j 网易云
  # 留空 = 官方全部分类随机；可用英文逗号组合，如 'd,i,k'
  category: 'd,i,k'
  quoteCount: 5 # 每次预取多少条一言（预取后交给自己循环轮播）
  loop: true # 是否循环
  refreshInterval: 4000 # 一句展示完后，隔多少毫秒换下一句
  showCursor: true # 是否显示光标
  startDelay: 300 # 开始延迟
  typeSpeed: 100 # 打字速度
