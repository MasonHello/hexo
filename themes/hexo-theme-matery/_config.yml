# ==========================================================
# hexo-theme-matery 配置文件（Mason 定制版）
# 主题仓库: https://github.com/blinkfox/hexo-theme-matery
# 站点名称 / 作者 / 版权统一在根目录 _config.yml 中配置为 Mason
# ==========================================================

# main menu navigation url and icon
# 菜单支持二级（children）：父级只作为分组，不跳转
menu:
  HOME:
    url: /
    icon: fas fa-home
  SEC:
    url: javascript:;
    icon: fas fa-shield-alt
    children:
      - name: WEB
        url: /categories/WEB/
        icon: fas fa-globe
      - name: CTF
        url: /categories/CTF/
        icon: fas fa-flag
  CODE:
    url: javascript:;
    icon: fas fa-code
    children:
      - name: JAVA
        url: /categories/Java/
        icon: fab fa-java
      - name: Python
        url: /categories/Python/
        icon: fab fa-python
  Internet:
    url: javascript:;
    icon: fas fa-network-wired
    children:
      - name: HCIP
        url: /categories/HCIP/
        icon: fas fa-certificate
      - name: Linux
        url: /categories/Linux/
        icon: fab fa-linux
  Others:
    url: javascript:;
    icon: fas fa-list
    children:
      - name: 标签
        url: /tags/
        icon: fas fa-tags
      - name: 分类
        url: /categories/
        icon: fas fa-bookmark
      - name: 归档
        url: /archives/
        icon: fas fa-archive
  关于:
    url: javascript:;
    icon: fas fa-user-circle
    children:
      - name: 留言板
        url: /contact/
        icon: fas fa-comments
      - name: 友情链接
        url: /friends/
        icon: fas fa-address-book
# Website start time.
# 站点运行开始时间.
time:
  enable: true
  year: 2026 # 年份
  month: 10 # 月份
  date: 30 # 日期
  hour: 00 # 小时
  minute: 00 # 分钟
  second: 00 # 秒

# Index cover carousel configuration.
# 首页封面轮播图的相关配置.
cover:
  showPrevNext: true # 是否显示左右切换按钮. Whether to display the left and right toggle buttons.
  showIndicators: true # 是否显示指示器. # Whether to display the indicators
  autoLoop: true # 是否自动轮播. Whether it is automatically rotated.
  duration: 120 # 切换延迟时间. Switching delay time.
  intervalTime: 9000 # 自动切换下一张的间隔时间（打字副标题需要时间，建议 ≥8000）. Automatically switch the interval of the next one.
  useConfig: false # 是否使用配置文件, 在 _data/covers.json 下配置推荐文章, false则使用主题在文章中的配置 cover coverImg
  video:
    enable: false
    src:

# index page dream text,
# 配置首页显示"梦想"的语句.
dream:
  enable: true
  showTitle: true
  title: 个性签名
  text: 始终保持好奇，永远敬畏技术。用输出倒逼输入，把每一次踩坑都写成可复用的文档。安全不是一次性的测试，而是持续的工程实践。

# Whether to display the musics.
# 是否在首页显示音乐.
music:
  enable: false
  title: #非吸底模式有效
    enable: true
    show: 听听音乐
  autoHide: true    # hide automaticaly
  server: netease   #require	music platform: netease, tencent, kugou, xiami, baidu
  type: playlist    #require song, playlist, album, search, artist
  id: 503838841     #require	song id / playlist id / album id / search keyword
  fixed: true       # 开启吸底模式
  autoplay: false   # 是否自动播放
  theme: '#42b983'
  loop: 'all'       # 音频循环播放, 可选值: 'all', 'one', 'none'
  order: 'random'   # 音频循环顺序, 可选值: 'list', 'random'
  preload: 'auto'   # 预加载，可选值: 'none', 'metadata', 'auto'
  volume: 0.7       # 默认音量，请注意播放器会记忆用户设置，用户手动设置音量后默认音量即失效
  listFolded: true  # 列表默认折叠
  hideLrc: true     # 隐藏歌词

# Whether to display the musics.
# 单独的音乐页面.
musics:
  enable: false
  title:          #非吸底模式有效
    enable: true
    show: 听听音乐
  server: tencent   #require music platform: netease, tencent, kugou, xiami, baidu
  type: playlist    #require song, playlist, album, search, artist
  id: 1776127550     #require song id / playlist id / album id / search keyword
  fixed: false      # 开启吸底模式
  autoplay: true   # 是否自动播放
  theme: '#42b983'
  loop: 'all'       # 音频循环播放, 可选值: 'all', 'one', 'none'
  order: 'random'   # 音频循环顺序, 可选值: 'list', 'random'
  preload: 'auto'   # 预加载，可选值: 'none', 'metadata', 'auto'
  volume: 0.7       # 默认音量，请注意播放器会记忆用户设置，用户手动设置音量后默认音量即失效
  listFolded: false  # 列表默认折叠
  listMaxHeight: "525px" #列表最大高度

# Whether to display the videos.
# 是否在首页显示视频.
video:
  enable: false
  showTitle: true
  title: 精彩视频
  url:
  iframeUrl:
  pic:
  thumbnails:
  height:
  autoplay: false
  theme: '#42b983'
  loop: false
  preload: 'auto'
  volume: 0.7

# Whether to display the title of the recommended posts
# 是否显示推荐文章的标题
recommend:
  enable: true
  showTitle: true
  useConfig: false # 是否使用配置文件, 在 _data/recommends.json 下配置推荐文章, false则会走主题配置的 top 属性

# Configure website favicon and LOGO
# 配置网站favicon和网站LOGO
favicon: /favicon.png
logo: /medias/logo.png

# The configuration of the second button in the home banner,
# 首页 banner 中的第二个按钮的配置，包括按钮的显示名称、font awesome图标和按钮的超链接.
indexbtn:
  enable: true
  name: GitHub
  icon: fab fa-github-alt
  url: https://github.com/MasonHello

# The configurations of the second line of home banner
# 首页 banner 中的第二行个人信息配置，留空即不启用
socialLink:
  github: https://github.com/MasonHello
  email: # 你的邮箱，例如 mason@example.com
  facebook:
  twitter:
  qq:
  weibo:
  zhihu:
  rss: true # true、false

# Whether to activate the Post TOC, and Configure which title types are supported by TOC support.
# 是否激活文章 TOC 功能，并配置TOC支持选中哪些标题类型，这是全局配置。
toc:
  enable: true
  heading: h2, h3, h4
  collapseDepth: 0 # 目录默认展开层级
  showToggleBtn: true # 是否显示切换TOC目录展开收缩的按钮

# 代码块相关
code:
  lang: true # 代码块是否显示名称
  copy: true # 代码块是否可复制
  shrink: true # 代码块是否可以收缩
  break: false # 代码是否折行

# 是否激活文章末尾的打赏功能，默认激活（你替换为的你自己的微信、支付宝二维码图片、或者使用网络图片也可以）.
reward:
  enable: false
  title: 你的赏识是我前进的动力
  wechat: /medias/reward/wechat.png
  alipay: /medias/reward/alipay.jpg

# Whether to activate the copyright information of the blog and author when copying the post content.
# 是否激活复制文章时追加博客和作者的版权信息.
copyright:
  enable: true
  minCharNumber: 120 # 至少复制多少个字符就追加版权信息.
  description: 本文由 Mason 原创，著作权归 Mason 所有，任何形式的转载都请注明出处并保留本声明。

# Whether to activate the mathjax.
# 是否激活mathjax数学公式，需要渲染的文章在 Front-matter 中再加 `mathjax: true`.
mathjax:
  enable: false
  cdn: https://cdn.bootcss.com/mathjax/2.7.5/MathJax.js?config=TeX-AMS-MML_HTMLorMML

# Post word count, reading duration, site total word count.
# 文章字数统计、阅读时长、总字数统计等（依赖插件 hexo-wordcount）
postInfo:
  date: true # 发布日期
  update: true # 更新日期
  wordCount: true # 文章字数统计
  totalCount: true # 站点总文章字数
  min2read: true # 文章阅读时长
  readCount: true # 文章阅读次数

# Post outdated notice at the top of the article.
# 文章页顶部时效性提示：按「发布至今的天数」分级，文章还新就不提示，越旧提示越强
#   days: 发布满多少天后显示这一级（按 days 从小到大匹配第一个满足的级别）
#   icon: Font Awesome 图标；text 中的 {ago} 会替换为「3 个月前」，{date} 为发布日期，{days} 为天数
#   想调整分级：改 days / 文案即可；想全部文章都提示，把第一级的 days 改成 0
postNotice:
  enable: true
  levels:
    - days: 30 # 发布满 30 天：轻微提示
      icon: fas fa-info-circle
      text: 本文发布于 {ago}（{date}），文中部分细节可能已有变化，请留意甄别。
    - days: 180 # 发布满 180 天：提示可能不再适用
      icon: fas fa-exclamation-triangle
      text: 本文发布于 {ago}（{date}），部分内容可能已不再适用，请酌情参考。
    - days: 365 # 发布满 1 年：提示可能已过时
      icon: fas fa-exclamation-circle
      text: 本文发布于 {ago}（{date}），技术更新较快，内容大概率已过时，请谨慎参考。

